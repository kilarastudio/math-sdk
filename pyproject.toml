[project]
name = "stakeengine"
version = "0.0.0"
description = "Python engine for defining game rules, simulating outcomes, and optimizing win distributions."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "CarrotRGS" }]
dependencies = [
    "boto3==1.35.97",
    "botocore==1.35.97",
    "iniconfig==2.1.0",
    "jmespath==1.0.1",
    "numpy==2.2.5",
    "packaging==25.0",
    "pluggy==1.6.0",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.1.0",
    "s3transfer==0.10.4",
    "six==1.17.0",
    "toml",
    "urllib3==2.4.0",
    "xlsxwriter==3.2.0",
    "zstandard==0.23.0",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest==8.3.5"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "src"
