name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"

      - name: Sync dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest tests/ -v
